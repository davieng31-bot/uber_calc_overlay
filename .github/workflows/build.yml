name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Clean Project & Inject Files
        run: |
          flutter create app_temp --org com.example.ubercalc --platforms=android
          cp main.dart app_temp/lib/main.dart
          cp pubspec.yaml app_temp/pubspec.yaml
          if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml app_temp/android/app/src/main/AndroidManifest.xml
          fi

      - name: Build APK
        run: |
          cd app_temp
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app_temp/build/app/outputs/flutter-apk/app-release.apk
          
          
          
